<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#121228"/>
      <stop offset="100%" stop-color="#07070f"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd34e"/>
      <stop offset="100%" stop-color="#ff9a3d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="140" cy="90" r="2" opacity="0.8"/>
    <circle cx="300" cy="160" r="1.5" opacity="0.6"/>
    <circle cx="520" cy="70" r="2" opacity="0.7"/>
    <circle cx="820" cy="120" r="1.5" opacity="0.5"/>
    <circle cx="1040" cy="80" r="2.4" opacity="0.9"/>
    <circle cx="980" cy="300" r="1.6" opacity="0.6"/>
    <circle cx="180" cy="420" r="1.8" opacity="0.7"/>
    <circle cx="1100" cy="500" r="2" opacity="0.7"/>
    <circle cx="420" cy="540" r="1.5" opacity="0.5"/>
  </g>
  <g fill="#ffd34e">
    <circle cx="700" cy="220" r="2.6" opacity="0.9"/>
    <circle cx="240" cy="260" r="2" opacity="0.8"/>
    <circle cx="920" cy="470" r="2.2" opacity="0.8"/>
  </g>

  <!-- vinyl disc motif (right) -->
  <g transform="translate(940,315)">
    <circle r="150" fill="#0c0c16" stroke="rgba(124,108,255,.3)" stroke-width="2"/>
    <circle r="120" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="2"/>
    <circle r="90" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="2"/>
    <circle r="52" fill="#ffd34e"/>
    <circle r="9" fill="#0a0a12"/>
  </g>

  <!-- text -->
  <text x="90" y="250" font-family="'Space Grotesk', Arial, sans-serif" font-size="34" fill="#a6a6bd" letter-spacing="6">LEWIS SAWE</text>
  <text x="86" y="340" font-family="'Space Grotesk', Arial, sans-serif" font-size="78" font-weight="700" fill="#f4f4f8">Cloud by day,</text>
  <text x="86" y="430" font-family="'Space Grotesk', Arial, sans-serif" font-size="78" font-weight="700" fill="url(#hl)">space DJ by night.</text>
  <text x="90" y="500" font-family="'JetBrains Mono', monospace" font-size="26" fill="#a6a6bd">AWS · DevOps · Security · built &amp; hosted on AWS</text>
</svg>
